# related_formalizations - prior or parallel formalizations, if known.
# Mathlib is both a dependency of this project and a prior formalization of several
# of the same statements; this project deliberately reproves them by other routes.
related_formalizations:
  - name: "mathlib4"
    id: "https://github.com/leanprover-community/mathlib4"
    revision: "v4.32.0"
    relationship: "builds-on"
    # Mathlib declarations with the same mathematical content as statements proved
    # here. None of them is used to prove its counterpart in this project.
    overlapping_declarations:
      - "Nat.exists_infinite_primes (infinitude of primes)"
      - "ZMod.pow_card (Fermat's little theorem)"
      - "irrational_sqrt_two (irrationality of sqrt 2)"
      - "Nat.Prime.sq_add_sq (Fermat's theorem on sums of two squares)"
      - "hasSum_zeta_two (the Basel problem)"
    note: >-
      Mathlib is this project's library dependency, and it is also a prior
      formalization of several of the same statements. The overlapping declarations
      listed above are not used here: each theorem family declares its own
      `Prop`-valued statement in a `*/Defs.lean` file, and every proof in this
      project proves that `Prop` afresh rather than deriving it from the mathlib
      counterpart. Some of those proofs may well coincide mathematically with
      mathlib's; the point is that they are carried out independently, not
      re-exported. Other mathlib results are of course used freely inside the
      proofs.

# classification - what area of mathematics the formalized result belongs to.
classification:
  arxiv: ["math.NT", "math.CO", "math.HO", "cs.LO"]
  msc2020: ["11A41", "11A07", "11E25", "11J72", "11M06", "05A19", "05B45", "52C20", "68V20"]

# project status
status:
  scope: >-
    Formalizations of several genuinely different proofs of the same mathematical
    statement, so that the proofs can be compared side by side. Each theorem family
    fixes one `Prop`-valued statement in a `Defs.lean` file, and every proof in that
    family proves exactly that `Prop`. Currently covered: Fermat's little theorem
    (4 proofs), the infinitude of primes (9 proofs, including a Dirichlet-style pair
    for the classes 1 and 3 mod 4), the irrationality of sqrt 2 (3 proofs),
    Fermat's theorem on sums of two squares (4 proofs), the Basel problem (2 proofs),
    the integer-rectangle tiling theorem of Wagon (12 of his 14 proofs), and two
    combinatorial identities (Pascal's rule and the hockey-stick identity, each
    proved two ways). A Verso blueprint under `DifferentProofsBlueprint/` records the
    informal statements, proof sketches, and dependency graph; reusable supporting
    lemmas that could be upstreamed live in `DifferentProofsForMathlib/`.
  # Every declaration in the project is sorry-free.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: &standard_axioms
    - propext
    - Classical.choice
    - Quot.sound
  # `sorryAx` occurs in no declaration. Verified with `#print axioms` against a
  # `lake env lean` file importing `DifferentProofs`.
  #
  # No result in this project has literature dependencies: every proof is complete
  # down to mathlib and the three standard axioms. The project does not use
  # leanprover/comparator, so `comparator_config` is omitted throughout.
  main_results:
    # --- Fermat's little theorem (statement: `FermatLittleTheorem`) ---
