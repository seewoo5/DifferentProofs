# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4): repo-root metadata for formalization projects.
# Requiredness/conformance:
#   - Fields marked [required] should be present and filled.
#   - Fields not marked [required] are examples/recommended metadata only; they may be omitted.
#   - Projects may add extra YAML keys at any level. Readers should tolerate unknown keys.
# This is a lightweight reporting schema, not a closed validation schema.

version: "v0.4"

# project - the formalization itself (not the source).
project:
  name: "Different Proofs"     # [required]
  authors:                     # [required] who did the formalization
    - "Seewoo Lee"
  responsible_maintainers:     # people responsible for the formalization repository
    - "Seewoo Lee"
  license: "Apache-2.0"        # [required]

# This repository is the substantive formalization; no packaging layer is involved,
# so `repository.substantive_formalization` is deliberately omitted.

# sources - what was formalized. Sources may be articles, books, web posts,
# folklore, conversations, or anything else; no arXiv record is assumed.
#
# This project formalizes several *different* proofs of each of a handful of
# results, so the source list is correspondingly long. Where a proof is genuinely
# classical and the project worked from the standard textbook argument rather than
# a specific paper, the entry is typed `folklore` and carries no identifier; no
# citation is asserted that the repository itself does not record.
sources:                       # [required] list of sources or an original proof
