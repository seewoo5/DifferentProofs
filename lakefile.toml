name = "different-proofs"
version = "0.1.0"
defaultTargets = ["DifferentProofs", "DifferentProofsForMathlib"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.flexible = false
weak.linter.style.header = false
experimental.module = true

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

# Pin verso to its release tag. This direct require overrides the verso pin that
# VersoBlueprint passes on (at v4.35.0 that is the v4.35.0-rc4 tag; at v4.32.0 it
# was an orphaned commit that a fresh `git fetch` could not retrieve).
[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.35.0"

[[require]]
name = "VersoBlueprint"
git = "https://github.com/leanprover/verso-blueprint"
rev = "v4.35.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "DifferentProofs"

[[lean_lib]]
name = "DifferentProofsForMathlib"

[[lean_lib]]
name = "DifferentProofsBlueprint"

# Comparator challenge statements. Deliberately outside `defaultTargets`: every
# theorem here is a `sorry`, so `lake build` would report nothing but warnings.
# Comparator builds these modules itself. See `README.md`.
[[lean_lib]]
name = "DifferentProofsChallenge"
