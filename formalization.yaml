# fidelity
fidelity:
  divergences: >-
    - Each theorem family fixes a single `Prop`-valued statement in its `Defs.lean`
      file and every proof in the family proves that same `Prop`; this is a
      deliberate deviation from the sources, which state their results informally,
      and it is what makes the proofs comparable.
    - Wagon's paper is followed proof by proof, but the setup is not his: rectangles
      are encoded by their corner coordinates (`IntegerRectangle.Rectangle`) and a
      tiling is recorded as `IsTiling` (finite cover with pairwise-disjoint
      interiors). Where Wagon says "place the rectangle in standard position", the
      formalization instead bases the integrand, lattice, or grid at the tiled
      rectangle's own corner, which avoids translating the tiling; and several of
      his per-proof local arguments are factored into shared lemmas
      (`IsTiling.sum_fgArea`, `CornerCount`, `Cells`, `Walks`) reused across proofs.
    - Wagon's proofs 11 (minimal cut-set, Seymour) and 14 (Sperner's lemma, Schmerl)
      are not formalized. Both need machinery mathlib does not have: planar duality
      and a planar min-cut theorem for proof 11, and geometric Sperner for an
      arbitrary triangulation with T-vertices for proof 14 (mathlib's `Sperner` is
      the antichain theorem).
    - Wunderlich's argument is adapted: the formalization uses F_37 = 73 * 149 * 2221
      as its concrete Fibonacci number with three distinct prime factors.
    - The Dirichlet-style file covers only the residue classes 1 and 3 mod 4, not
      Dirichlet's theorem in general.
    - Reusable supporting results are stated in mathlib-friendly generality under
      `DifferentProofsForMathlib/`, mirroring mathlib's directory layout, rather
      than in the narrow form each proof needs.

# review status
review:
  status: "self-assessed"      # [required]
  reviewers:
    - "Seewoo Lee"
  notes: >-
    Reviewed by the project author rather than by an independent reviewer. Per
    CONTRIBUTING.md, AI-assisted work is checked line by line before merge, with
    particular attention to whether each theorem statement says exactly what is
    intended and whether each proof step proves the intended intermediate claim.
    Contributions land through pull requests with CI running `lake build` over the
    whole project. Axiom hygiene was checked with `#print axioms` on every main
    result listed above.

# alignment - how source statements map to formal declarations. The table below
# covers the one source with an enumerated internal structure (Wagon's fourteen
# proofs) together with the top-level statement of each theorem family; the
# remaining proofs are aligned one-to-one with the sources listed above, and the
# blueprint under `DifferentProofsBlueprint/` records the full correspondence.
alignment:
  namespace: ""                # declarations live in the root namespace and in per-proof namespaces
  statements:
    # Theorem-family statements.
    - source: "Fermat's little theorem"
      lean: "FermatLittleTheorem"
      module: "DifferentProofs.FermatLittleTheorem.Defs"
      status: "proved"
      note: "Proved four ways; see `main_results`."
    - source: "Infinitude of primes"
      lean: "InfinitudeOfPrimes"
      module: "DifferentProofs.InfinitudeOfPrimes.Defs"
      status: "proved"
      note: "Proved nine ways, including Dirichlet-style variants for the classes 1 and 3 mod 4."
    - source: "Irrationality of sqrt 2"
      lean: "IrrationalSqrtTwo"
      module: "DifferentProofs.IrrationalSqrtTwo.Defs"
      status: "proved"
      note: "Proved three ways."
    - source: "Fermat's theorem on sums of two squares"
      lean: "FermatSumOfTwoSquares"
      module: "DifferentProofs.SumOfTwoSquares.Defs"
      status: "proved"
      note: "Proved four ways."
    - source: "Basel problem"
      lean: "BaselProblem"
      module: "DifferentProofs.BaselProblem.Defs"
      status: "proved"
      note: "Proved two ways."
    - source: "Wagon, statement: a rectangle tiled by rectangles each having an integer side has an integer side"
      lean: "IntegerRectangle.IntegerRectangleTheorem"
      module: "DifferentProofs.IntegerRectangle.Defs"
      status: "proved"
